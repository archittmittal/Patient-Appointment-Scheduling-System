name: "Close Stale Issues and PRs"

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue is stale because it has been open 60 days with no activity. Remove stale label or comment or this will be closed in 7 days.'
          close-issue-message: 'This issue was closed because it has been inactive for 7 days since being marked stale.'
          stale-pr-message: 'This PR is stale because it has been open 45 days with no activity. Remove stale label or comment or this will be closed in 7 days.'
          close-pr-message: 'This PR was closed because it has been inactive for 7 days since being marked stale.'
          days-before-stale: 60
          days-before-pr-stale: 45
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
